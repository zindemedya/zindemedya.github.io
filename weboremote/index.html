<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WeboRemote – Remote for LG TV</title><link rel="stylesheet" href="/assets/style.css"></head><body>
<header><div class="brand">WeboRemote</div><div class="sub" id="sub"></div></header>
<main><div class="lang" id="langs"></div><div class="card"><h1>WeboRemote – Remote for LG TV</h1><p id="desc"></p><p class="notice" id="notice"></p><nav><a id="privacyLink" href="/weboremote/privacy/"></a><a id="termsLink" href="/weboremote/terms/"></a><a id="supportLink" href="/weboremote/support/"></a></nav></div></main>
<footer>© 2026 Zinde Medya</footer>
<script>
const langs=[['tr','Türkçe'],['en','English'],['de','Deutsch'],['es','Español'],['fr','Français'],['pt-br','Português (Brasil)']];
const t={
tr:{sub:'LG TV için Kumanda · Zinde Medya',desc:'Uyumlu LG webOS TV’leri yerel ağınız üzerinden kontrol edin.',notice:'WeboRemote bağımsız bir uygulamadır; LG Electronics ile bağlantılı değildir, LG tarafından desteklenmez veya sponsor edilmez. LG ve webOS ilgili hak sahiplerinin ticari markalarıdır.',privacy:'Gizlilik Politikası',terms:'Kullanım Koşulları',support:'Destek'},
en:{sub:'Remote for LG TV · Zinde Medya',desc:'Control compatible LG webOS TVs over your local network.',notice:'WeboRemote is an independent application and is not affiliated with, endorsed by, or sponsored by LG Electronics. LG and webOS are trademarks of their respective owners.',privacy:'Privacy Policy',terms:'Terms of Use',support:'Support'},
de:{sub:'Fernbedienung für LG TV · Zinde Medya',desc:'Steuern Sie kompatible LG webOS-Fernseher über Ihr lokales Netzwerk.',notice:'WeboRemote ist eine unabhängige App und steht in keiner Verbindung zu LG Electronics; sie wird von LG weder unterstützt noch gesponsert. LG und webOS sind Marken ihrer jeweiligen Inhaber.',privacy:'Datenschutzerklärung',terms:'Nutzungsbedingungen',support:'Support'},
es:{sub:'Mando para LG TV · Zinde Medya',desc:'Controla televisores LG webOS compatibles a través de tu red local.',notice:'WeboRemote es una aplicación independiente y no está afiliada, respaldada ni patrocinada por LG Electronics. LG y webOS son marcas de sus respectivos propietarios.',privacy:'Política de privacidad',terms:'Términos de uso',support:'Soporte'},
fr:{sub:'Télécommande pour LG TV · Zinde Medya',desc:'Contrôlez les téléviseurs LG webOS compatibles via votre réseau local.',notice:'WeboRemote est une application indépendante et n’est ni affiliée, ni approuvée, ni sponsorisée par LG Electronics. LG et webOS sont des marques appartenant à leurs propriétaires respectifs.',privacy:'Politique de confidentialité',terms:'Conditions d’utilisation',support:'Assistance'},
'pt-br':{sub:'Controle para LG TV · Zinde Medya',desc:'Controle TVs LG webOS compatíveis pela sua rede local.',notice:'WeboRemote é um aplicativo independente e não é afiliado, endossado nem patrocinado pela LG Electronics. LG e webOS são marcas de seus respectivos proprietários.',privacy:'Política de Privacidade',terms:'Termos de Uso',support:'Suporte'}
};
function pick(){const q=new URLSearchParams(location.search).get('lang');if(t[q])return q;const n=(navigator.language||'en').toLowerCase();if(n.startsWith('tr'))return'tr';if(n.startsWith('de'))return'de';if(n.startsWith('es'))return'es';if(n.startsWith('fr'))return'fr';if(n.startsWith('pt'))return'pt-br';return'en'}
function show(l){const x=t[l]||t.en;document.documentElement.lang=l==='pt-br'?'pt-BR':l;sub.textContent=x.sub;desc.textContent=x.desc;notice.textContent=x.notice;privacyLink.textContent=x.privacy;termsLink.textContent=x.terms;supportLink.textContent=x.support;document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('active',b.dataset.lang===l));history.replaceState(null,'','?lang='+l)}
langs.innerHTML=langs.map(x=>'<button data-lang="'+x[0]+'">'+x[1]+'</button>').join('');document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>show(b.dataset.lang));show(pick());
</script></body></html>
